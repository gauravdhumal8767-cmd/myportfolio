<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal Portfolio - Modern, Responsive Frontend Developer Portfolio" />
  <title>Gaurav | Frontend Developer Portfolio.</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- EmailJS Browser SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    :root {
      --font-primary: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --secondary: #06b6d4;
      --accent: #8b5cf6;
      
      --dark-bg: #0b0f19;
      --dark-card: #111827;
      --dark-border: rgba(255, 255, 255, 0.08);
      
      --light-bg: #f8fafc;
      --light-card: #ffffff;
      --light-border: #e2e8f0;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      --gradient-accent: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 20px 35px -10px rgba(79, 70, 229, 0.12), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      --shadow-glow: 0 0 25px rgba(79, 70, 229, 0.25);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      color: var(--text-main);
      background-color: var(--light-bg);
      line-height: 1.65;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-primary);
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    section {
      scroll-margin-top: 85px;
    }

    .bg-gradient-primary {
      background: var(--gradient-primary) !important;
    }

    .text-gradient {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-soft-primary {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      border-radius: var(--radius-full);
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .badge-tag {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      transition: var(--transition-fast);
    }

    .badge-tag:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: #c7d2fe;
    }

    .btn-primary-custom {
      background: var(--gradient-primary);
      color: #ffffff !important;
      border: none;
      font-weight: 600;
      padding: 0.75rem 1.6rem;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.35);
      transition: var(--transition-normal);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-primary-custom:hover {
      background: linear-gradient(135deg, #4338ca 0%, #0891b2 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(79, 70, 229, 0.45);
    }

    .btn-outline-custom {
      background: #ffffff;
      color: var(--text-main) !important;
      border: 1.5px solid #cbd5e1;
      font-weight: 600;
      padding: 0.75rem 1.6rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: var(--transition-normal);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-outline-custom:hover {
      background: #f8fafc;
      color: var(--primary) !important;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .section-badge {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #0f172a;
    }

    @media (max-width: 768px) {
      .section-title {
        font-size: 1.85rem;
      }
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 620px;
      margin: 0 auto;
    }

    .custom-navbar {
      transition: all 0.3s ease-in-out;
      padding: 1rem 0;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    .custom-navbar.scrolled {
      padding: 0.65rem 0;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
    }

    .navbar-brand-custom {
      font-family: var(--font-primary);
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }

    .brand-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }

    .nav-link-custom {
      font-weight: 500;
      font-size: 0.95rem;
      color: #475569 !important;
      padding: 0.5rem 0.9rem !important;
      border-radius: var(--radius-sm);
      transition: var(--transition-fast);
      position: relative;
    }

    .nav-link-custom:hover {
      color: var(--primary) !important;
    }

    .nav-link-custom.active {
      color: var(--primary) !important;
      font-weight: 600;
    }

    .nav-link-custom.active::after {
      content: '';
      position: absolute;
      bottom: 0px;
      left: 0.9rem;
      right: 0.9rem;
      height: 2px;
      background: var(--gradient-primary);
      border-radius: 2px;
    }

    .hero-section {
      position: relative;
      min-height: 90vh;
      display: flex;
      align-items: center;
      padding: 6rem 0 4rem;
      background: radial-gradient(circle at 85% 15%, rgba(79, 70, 229, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 10% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                  #f8fafc;
      overflow: hidden;
    }

    .hero-avatar-wrapper {
      position: relative;
      display: inline-block;
    }

    .hero-avatar-outer {
      width: 290px;
      height: 290px;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      background: var(--gradient-primary);
      padding: 6px;
      box-shadow: var(--shadow-glow);
      animation: morphShape 8s ease-in-out infinite alternate;
    }

    @keyframes morphShape {
      0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      50% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      100% { border-radius: 40% 60% 60% 40% / 40% 60% 40% 60%; }
    }

    .hero-avatar-inner {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: inherit;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .hero-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: inherit;
      transition: transform 0.5s ease;
    }

    .hero-avatar-outer:hover .hero-avatar-img {
      transform: scale(1.06);
    }

    .hero-avatar-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
    }

    .hero-floating-badge {
      position: absolute;
      background: #ffffff;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 2;
      animation: floatSlow 4s ease-in-out infinite alternate;
    }

    .hero-floating-badge-1 { bottom: 20px; left: -20px; }
    .hero-floating-badge-2 { top: 25px; right: -25px; animation-delay: -2s; }

    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    .hero-stats-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-normal);
    }

    .hero-stats-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .about-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid #e2e8f0;
      box-shadow: var(--shadow-sm);
      padding: 2rem;
      height: 100%;
      transition: var(--transition-normal);
    }

    .about-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .timeline-item {
      position: relative;
      padding-left: 28px;
      padding-bottom: 1.5rem;
      border-left: 2px solid #e2e8f0;
    }

    .timeline-item:last-child {
      border-left: 2px solid transparent;
      padding-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -7px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .skill-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-normal);
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .skill-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-primary);
      opacity: 0;
      transition: var(--transition-fast);
    }

    .skill-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .skill-card:hover::before {
      opacity: 1;
    }

    .skill-icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }

    .progress-custom {
      height: 8px;
      background-color: #f1f5f9;
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-custom {
      background: var(--gradient-primary);
      border-radius: var(--radius-full);
    }

    .project-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-normal);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .project-img-wrapper {
      height: 200px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: var(--transition-normal);
    }

    .project-card:hover .project-overlay {
      opacity: 1;
    }

    .project-mockup-content {
      width: 85%;
      height: 75%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .contact-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
    }

    .form-control-custom {
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 0.8rem 1.1rem;
      font-size: 0.95rem;
      transition: var(--transition-fast);
      background-color: #f8fafc;
    }

    .form-control-custom:focus {
      background-color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      outline: none;
    }

    .contact-info-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .contact-icon-box {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      background-color: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .social-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      text-decoration: none;
      transition: var(--transition-fast);
      border: 1px solid #e2e8f0;
    }

    .social-circle-btn:hover {
      background: var(--primary);
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
      border-color: var(--primary);
    }

    .footer-section {
      background-color: var(--dark-card);
      color: #94a3b8;
      padding: 4rem 0 2rem;
      border-top: 1px solid var(--dark-border);
    }

    .footer-social-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .footer-social-btn:hover {
      background: var(--primary);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .back-to-top-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: var(--radius-md);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .back-to-top-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Legacy standalone React implementation retained for reference.
  <script type="text/babel" data-type="module">
    import { portfolioData } from './src/data/portfolioData.js';
    const { useState, useEffect } = React;

    const Navbar = ({ personal }) => {
      const [isScrolled, setIsScrolled] = useState(false);
      const [isNavCollapsed, setIsNavCollapsed] = useState(true);
      const [activeSection, setActiveSection] = useState('home');

      const initials = personal?.name
        ? personal.name.trim().split(/\s+/).map((n) => n[0]).join('').toUpperCase()
        : 'P';

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 40);
          const sections = ['home', 'about', 'skills', 'projects', 'contact'];
          const scrollPosition = window.scrollY + 200;
          for (const sectionId of sections) {
            const el = document.getElementById(sectionId);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPosition >= top && scrollPosition < top + height) {
                setActiveSection(sectionId);
                break;
              }
            }
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const handleNavClick = (e, targetId) => {
        e.preventDefault();
        setIsNavCollapsed(true);
        const element = document.getElementById(targetId);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const navLinks = [
        { id: 'home', label: 'Home' },
        { id: 'about', label: 'About' },
        { id: 'skills', label: 'Skills' },
        { id: 'projects', label: 'Projects' },
        { id: 'contact', label: 'Contact' },
      ];

      return (
        <nav className={`navbar navbar-expand-lg fixed-top custom-navbar ${isScrolled ? 'scrolled' : ''}`}>
          <div className="container">
            <a className="navbar-brand-custom" href="#home" onClick={(e) => handleNavClick(e, 'home')}>
              <div className="brand-icon-box">
                <span>{initials}</span>
              </div>
              <span>{personal?.name || 'Portfolio'}</span>
            </a>

            <button
              className="navbar-toggler border-0 shadow-none p-2"
              type="button"
              onClick={() => setIsNavCollapsed(!isNavCollapsed)}
            >
              <i className={`bi ${isNavCollapsed ? 'bi-list' : 'bi-x-lg'} fs-3 text-dark`}></i>
            </button>

            <div className={`collapse navbar-collapse justify-content-end ${!isNavCollapsed ? 'show' : ''}`} id="navbarNav">
              <ul className="navbar-nav align-items-lg-center gap-lg-1 my-3 my-lg-0">
                {navLinks.map((link) => (
                  <li className="nav-item" key={link.id}>
                    <a
                      className={`nav-link nav-link-custom ${activeSection === link.id ? 'active' : ''}`}
                      href={`#${link.id}`}
                      onClick={(e) => handleNavClick(e, link.id)}
                    >
                      {link.label}
                    </a>
                  </li>
                ))}
                <li className="nav-item ms-lg-3 mt-2 mt-lg-0">
                  <a
                    href="#contact"
                    className="btn-primary-custom btn-sm py-2 px-3 text-white"
                    onClick={(e) => handleNavClick(e, 'contact')}
                  >
                    <i className="bi bi-send-fill me-1"></i> Let's Talk
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      );
    };

    const Hero = ({ personal, stats }) => {
      const scrollToSection = (e, id) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const statistics = stats || [];

      return (
        <section id="home" className="hero-section">
          <div className="container">
            <div className="row align-items-center gy-5">
              <div className="col-lg-7 text-center text-lg-start">
                {personal?.availability && (
                  <div className="d-inline-flex align-items-center gap-2 badge-soft-primary mb-3">
                    <span className="spinner-grow spinner-grow-sm text-primary" role="status"></span>
                    <span>{personal.availability}</span>
                  </div>
                )}

                <h1 className="display-4 fw-bold mb-3">
                  Hi, I'm <span className="text-gradient">{personal?.name || 'Developer'}</span>
                </h1>

                <h2 className="h3 fw-semibold text-secondary mb-3">
                  {personal?.role || 'Frontend Developer'}
                </h2>

                <p className="lead text-muted mb-4 pe-lg-4">
                  {personal?.bioShort}
                </p>

                <div className="d-flex flex-wrap gap-3 justify-content-center justify-content-lg-start mb-5">
                  <a
                    href="#projects"
                    className="btn-primary-custom"
                    onClick={(e) => scrollToSection(e, 'projects')}
                  >
                    <i className="bi bi-grid-3x3-gap-fill"></i> View Projects
                  </a>
                  <a
                    href="#contact"
                    className="btn-outline-custom"
                    onClick={(e) => scrollToSection(e, 'contact')}
